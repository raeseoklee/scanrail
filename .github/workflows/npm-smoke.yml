name: npm Smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: scanrail npm version or dist-tag to install
        required: true
        default: latest
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and run published package
        run: node scripts/npm-smoke.mjs "${{ inputs.version || 'latest' }}"
