name: Publish npm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a dry-run or publish to npm
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      tag:
        description: npm dist-tag
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Record release metadata
        run: |
          echo "SCANRAIL_VERSION=$(node -p "require('./packages/npm/cli/package.json').version")" >> "$GITHUB_ENV"
          echo "SCANRAIL_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SCANRAIL_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm --version
      - run: npm run docs:check-links
      - run: npm test
      - run: npm run build:release
      - name: Dry-run npm publish
        if: ${{ inputs.mode == 'dry-run' }}
        run: node scripts/publish-npm.mjs --dry-run --tag "${{ inputs.tag }}"
      - name: Publish npm packages
        if: ${{ inputs.mode == 'publish' }}
        run: node scripts/publish-npm.mjs --publish --provenance --tag "${{ inputs.tag }}"
        env:
          SCANRAIL_ALLOW_NPM_PUBLISH: "1"
